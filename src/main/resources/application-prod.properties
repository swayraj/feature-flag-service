# Production Configuration

# Application
spring.application.name=feature-flag-service
server.port=${PORT:8080}

# Database — Railway injects these automatically when you link a Postgres service
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis — Railway injects REDIS_URL automatically when you link a Redis service
spring.data.redis.url=${REDIS_URL}
spring.data.redis.timeout=60000

# Cache
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

# Logging (less verbose in production)
logging.level.root=INFO
logging.level.com.flagservice=INFO
logging.level.org.hibernate.SQL=WARN

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Security (for production)
server.error.include-message=never
server.error.include-stacktrace=never